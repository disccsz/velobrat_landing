<svg width="320" height="67" viewBox="0 0 1964 411" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Велобрат">
  <defs>
    <linearGradient id="vb-grad-full" x1="205" y1="411" x2="205" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#0077FF"/>
    </linearGradient>
    <clipPath id="vb-clip-full">
      <rect width="411" height="411" rx="100"/>
    </clipPath>
  </defs>
  <!-- иконка слева -->
  <g>
    <rect width="411" height="411" rx="100" fill="url(#vb-grad-full)"/>
    <image href="/icon-512.png" x="0" y="0" width="411" height="411" preserveAspectRatio="xMidYMid slice" clip-path="url(#vb-clip-full)"/>
  </g>
  <!-- текст справа — упрощённый, бренд-текст -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="800" letter-spacing="-0.03em">
    <text x="520" y="185" font-size="140" fill="#0d1117">ВЕЛО</text>
    <text x="520" y="310" font-size="140" fill="#ff4400">БРАТ</text>
  </g>
</svg>
